name: Planner release

# Publishes a GitHub Release with the X3/X4 firmware built from this commit and
# the companion APK taken from the branch `release-assets`. Runs when
# .github/planner-release/ changes on main; does nothing if the tag exists.
on:
  push:
    branches: [main]
    paths: [".github/planner-release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read release settings
        id: cfg
        run: |
          grep -E '^[A-Z]+=' .github/planner-release/release.env >> "$GITHUB_OUTPUT"
          TAG=$(sed -n "s/^TAG=//p" .github/planner-release/release.env)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7
        if: steps.cfg.outputs.skip != 'true'
        with:
          version: "latest"

      - name: Install PlatformIO (same versions as planner-ci.yml)
        if: steps.cfg.outputs.skip != 'true'
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19" || true

      - name: Build firmware (Xteink X3/X4)
        if: steps.cfg.outputs.skip != 'true'
        run: |
          pio run -j4 -e default
          mkdir -p out
          cp .pio/build/default/firmware.bin out/firmware-x3-x4.bin

      - name: Companion APK
        if: steps.cfg.outputs.skip != 'true'
        run: |
          git fetch -q origin release-assets
          git show "FETCH_HEAD:${{ steps.cfg.outputs.APK }}" > "out/${{ steps.cfg.outputs.APK }}"
          git show FETCH_HEAD:SHA256SUMS | (cd out && sha256sum -c --ignore-missing)

      - name: Publish release
        if: steps.cfg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .github/planner-release/notes.md notes.md
          { echo; echo 'SHA-256'; echo '```'; (cd out && sha256sum *); echo '```'; } >> notes.md
          flags=""
          [ "${{ steps.cfg.outputs.PRERELEASE }}" = "true" ] && flags="--prerelease"
          gh release create "${{ steps.cfg.outputs.TAG }}" out/* --target "$GITHUB_SHA" \
            --title "${{ steps.cfg.outputs.TITLE }}" --notes-file notes.md $flags
